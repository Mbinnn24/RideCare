<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c3a">
  <title>RideCare — Rental Mobil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <nav class="navbar navbar-expand-lg navbar-dark rc-navbar sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#home">
          <span class="brand-mark"><i class="bi bi-car-front-fill"></i></span>
          <span>Ride<span class="brand-light">Care</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Buka navigasi">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="#home">Beranda</a></li>
            <li class="nav-item"><a class="nav-link" href="#cars">Cari Mobil</a></li>
            <li class="nav-item"><a class="nav-link" href="#bookings">Pesanan Saya</a></li>
            <li class="nav-item"><a class="nav-link" href="#tracking">Live Tracking</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2 nav-actions">
            <a class="btn btn-outline-light btn-sm px-3" href="#login">Masuk</a>
            <a class="btn btn-coral btn-sm px-3" href="#register">Daftar</a>
          </div>
        </div>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
    <footer class="rc-footer">
      <div class="container py-4">
        <div class="row align-items-center gy-3">
          <div class="col-md-6">
            <a class="footer-brand" href="#home"><i class="bi bi-car-front-fill me-2"></i>RideCare</a>
            <p class="mb-0 mt-2 small text-white-50">Perjalanan nyaman dimulai dari pilihan yang tepat.</p>
          </div>
          <div class="col-md-6 text-md-end small text-white-50">© <span id="year"></span> RideCare · Prototype UI/UX</div>
        </div>
      </div>
    </footer>
  </div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-dark border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex"><div class="toast-body" id="toastMessage">Informasi</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
